name: CI - Git Provenance Conflict Resolution Engine

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Scenario Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure Git for Testing
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@hacktoberfest2026.org"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          pip install -e .

      - name: Lint and Code Style Validation
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 git_provenance tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 git_provenance tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Execute Evaluation Scenarios
        run: |
          python examples/django_backport_scenario/run_scenario.py
          python examples/cpython_backport_scenario/run_scenario.py
          python examples/multi_branch_enterprise/run_scenario.py

      - name: Verify CLI Git Subcommand Integration
        run: |
          git-provenance --version
          git-provenance --help
